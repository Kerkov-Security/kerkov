[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kerkov"
version = "0.1.0"
description = "Security-focused conversational AI for penetration testing and security analysis"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "anthropic>=0.7.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
    "python-nmap>=0.7.1",
    "shodan>=1.31.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.19.0",
    "keyring>=25.0.0",
    "ptyprocess>=0.7.0",
    "prompt_toolkit>=3.0.52",
    "playwright>=1.44.0",
    "pyte>=0.8.2",
    "ptyprocess>=0.7.0; sys_platform != 'win32'",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    "psutil>=5.9.0; sys_platform == 'win32'",
    # Google auth also needs cryptography in CLI-only installs. 48.x is the last
    # release with an Intel macOS wheel; do not require a Rust build to install.
    # The second line is not redundant: without a conflicting requirement uv's
    # universal lock does not fork, and every non-Windows platform inherits the
    # Intel macOS cap.
    "cryptography>=48.0.1,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=50.0.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "trafilatura>=2.0.0,<3",
]

[project.optional-dependencies]
web = [
    "django>=5.2,<6.0",
    "channels[daphne]>=4.3,<5.0",
    # Keep uv's universal lock installable from wheels on Intel macOS; this
    # transitive Autobahn dependency dropped compatible wheels in newer releases.
    "cbor2>=5.6,<6.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "bandit>=1.7.5",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "pymdown-extensions>=10.7,<12.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2,<2.0",
]
security = [
    # impacket is intentionally not pinned here: it is never imported by Kerkov
    # (its CLIs are run as subprocesses) and it still calls OpenSSL.crypto.X509Req,
    # removed in pyOpenSSL 26.3, which the cryptography>=49 bump requires. Install
    # it from the distro (Kali ships it) or a separate venv when the ADCS/relay
    # workflow is needed.
    "scapy>=2.5.0",
    "paramiko>=3.3.0",
    "cryptography>=41.0.0",
]

[project.scripts]
kerkov = "kerkov.cli.main:main"
kerkov-web = "kerkov.web.manage:main"

[project.urls]
Homepage = "https://github.com/Kerkov-Security/kerkov"
Documentation = "https://github.com/Kerkov-Security/kerkov#readme"
Repository = "https://github.com/Kerkov-Security/kerkov"
Issues = "https://github.com/Kerkov-Security/kerkov/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kerkov*"]

[tool.setuptools.package-data]
"kerkov.config" = ["*.yaml"]
"kerkov.web.console" = [
    "templates/console/*.html",
    "static/console/*.css",
    "static/console/*.js",
    "static/console/brand/*.png",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "*_test.py"
python_classes = "*Test"
python_functions = "test_*"
addopts = [
    "--cov=kerkov",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--strict-markers",
    "-v"
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "security: marks tests as security-related",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert_used test
