site_name: Kerkov
site_url: https://kerkov-security.github.io/kerkov/
site_description: Open-source AI for penetration testing, security research, and CTFs.
site_author: Kerkov Security

repo_url: https://github.com/Kerkov-Security/kerkov
repo_name: Kerkov-Security/kerkov
edit_uri: edit/main/docs/

docs_dir: docs
copyright: Apache-2.0

theme:
  name: material
  logo: assets/kerkov.png
  favicon: assets/kerkov.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# `mkdocs build --strict` only fails on warnings, and MkDocs logs link problems at
# INFO by default — so strict alone would not have caught the broken relative
# links the audit found. Raising these to warnings is what makes it bite.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Unpublished pages are excluded from the build, not merely left out of the nav.
# MkDocs builds every file under docs_dir regardless of nav, so an unlisted page
# still ships as a live URL and still appears in sitemap.xml — which for the
# pages the issue #200 audit condemned is exactly the outcome "nothing unverified
# ships" is meant to prevent.
#
#   background/  the six condemned files, parked (open question 5). Never
#                published; see docs/background/README.md.
#   tools/       tools-overview.md and tool-approval.md, awaiting their
#                rewrites into reference/tools/ and guides/approvals.md.
exclude_docs: |
  background/
  tools/

# Only pages the audit passed are in the nav. Stage 3 of issue #200 moved the two
# internal-dev survivors into concepts/; agent-subsystem.md keeps its path until
# it is split into guides/agents.md + concepts/agent-subsystem.md.
nav:
  - Home: index.md
  - Reference:
      - Command-line interface: reference/cli.md
      - Slash commands: reference/slash-commands.md
      - Configuration: reference/configuration.md
  - Concepts:
      - Agent subsystem: agent-subsystem.md
      - Process management: concepts/process-management.md
      - Web architecture: concepts/web-architecture.md
