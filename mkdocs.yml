site_name: Kerkov
site_url: https://kerkov-security.github.io/kerkov/
site_description: Open-source AI for penetration testing, security research, and CTFs.
site_author: Kerkov Security

repo_url: https://github.com/Kerkov-Security/kerkov
repo_name: Kerkov-Security/kerkov
edit_uri: edit/main/docs/

docs_dir: docs
copyright: Apache-2.0

theme:
  name: material
  logo: assets/kerkov.png
  favicon: assets/kerkov.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# `mkdocs build --strict` only fails on warnings, and MkDocs logs link problems at
# INFO by default — so strict alone would not have caught the broken relative
# links the audit found. Raising these to warnings is what makes it bite.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Unpublished pages are excluded from the build, not merely left out of the nav.
# MkDocs builds every file under docs_dir regardless of nav, so an unlisted page
# still ships as a live URL and still appears in sitemap.xml — which for the
# pages the issue #200 audit condemned is exactly the outcome "nothing unverified
# ships" is meant to prevent.
#
#   background/  the six condemned files, parked (open question 5). Never
#                published; see docs/background/README.md.
#   /tools/      the OLD top-level tools/ (tools-overview.md, tool-approval.md),
#                superseded by reference/tools/ and guides/approvals.md and kept
#                only as mining source for contributing/writing-a-tool.md. The
#                leading slash anchors this to docs/tools/ so it does NOT also
#                exclude the published reference/tools/ pages.
exclude_docs: |
  background/
  /tools/

# Diátaxis-shaped: Get started → Guides → Reference → Concepts. Every page in the
# nav is verified against the source as it ships.
# which waits on the in-flight work editing that file.
nav:
  - Home: index.md
  - Get started:
      - Install: get-started/install.md
      - Your first engagement: get-started/first-engagement.md
      - Configuration: get-started/configuration.md
  - Guides:
      - Modes and autonomy: guides/modes-and-autonomy.md
      - Approvals: guides/approvals.md
      - Providers and models: guides/providers.md
      - Engagements: guides/engagements.md
      - Agents: guides/agents.md
      - Skills: guides/skills.md
      - Memory — recall & ledger: guides/memory.md
      - Web console: guides/web-console.md
      - Non-interactive use: guides/non-interactive.md
  - Reference:
      - Command-line interface: reference/cli.md
      - Slash commands: reference/slash-commands.md
      - Configuration: reference/configuration.md
      - Tools:
          - Overview: reference/tools/index.md
          - Read and write: reference/tools/read-write.md
          - Exec and process: reference/tools/exec-process.md
          - HTTP: reference/tools/http.md
          - Web search and page reads: reference/tools/web-search.md
          - CVE lookup: reference/tools/cve-lookup.md
          - Container lifecycle: reference/tools/container.md
          - SBOM and vulnerability scan: reference/tools/sbom-vulnerability-scan.md
          - SAST: reference/tools/sast.md
          - ZAP: reference/tools/zap.md
          - Browser: reference/tools/browser.md
          - Skills: reference/tools/skill.md
          - Recall: reference/tools/recall.md
          - Ledger: reference/tools/ledger.md
          - Delegate and agent_wait: reference/tools/delegate.md
      - Agent profiles: reference/agent-profiles.md
  - Concepts:
      - Agent subsystem: concepts/agent-subsystem.md
      - Process management: concepts/process-management.md
      - Web architecture: concepts/web-architecture.md
