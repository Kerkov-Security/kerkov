name: Chat / Functional

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to check out on the Pi runner
        required: false
        default: main
      prompt:
        description: Simple prompt to send to the chatbot
        required: false
        default: Tell me who you are in one short sentence.

jobs:
  functional-chat:
    name: Functional chat check on Pi runner
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    permissions:
      contents: read

    steps:
      - name: Check out repository for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check out repository for branch push
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Sync uv environment
        run: uv sync --locked --extra dev --extra test

      - name: Restore Codex auth state into workspace
        shell: bash
        run: |
          APP_HOME=~/.config/kerkov
          PERSISTENT_AUTH_PATH="${APP_HOME}/codex-auth.json"
          PERSISTENT_ENV_PATH="${APP_HOME}/.env"
          test -f "${PERSISTENT_ENV_PATH}"
          test -f "${PERSISTENT_AUTH_PATH}"
          cp "${PERSISTENT_ENV_PATH}" .env
          mkdir -p data/providers/codex
          cp "${PERSISTENT_AUTH_PATH}" data/providers/codex/auth.json

      - name: Verify persistent Pi auth state
        shell: bash
        run: |
          test -f data/providers/codex/auth.json
          echo "Found Codex auth state in runner workspace"

      - name: Run simple chatbot interaction
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -o pipefail
          set +e
          printf '/provider codex\n%s\n' "${{ inputs.prompt }}" \
            | timeout -s INT 30 uv run kerkov 2>&1 | tee /tmp/pi-functional-chat.log
          status=$?
          echo "chat_exit_status=${status}" | tee -a /tmp/pi-functional-chat.log
          exit 0

      - name: Run default chatbot interaction on branch push
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -o pipefail
          set +e
          printf '/provider codex\n%s\n' 'Tell me who you are in one short sentence.' \
            | timeout -s INT 30 uv run kerkov 2>&1 | tee /tmp/pi-functional-chat.log
          status=$?
          echo "chat_exit_status=${status}" | tee -a /tmp/pi-functional-chat.log
          exit 0
