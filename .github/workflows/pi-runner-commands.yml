name: Pi Runner Commands

on:
  push:
    branches:
      - ci/pi-runner-workflow
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to check out on the Pi runner
        required: false
        default: main
      working_directory:
        description: Working directory for the command block
        required: false
        default: .
      commands:
        description: Multiline shell commands to run on the Pi runner
        required: true
        default: |
          pwd
          echo "$GITHUB_WORKSPACE"
          uname -a

jobs:
  run-on-pi:
    name: Run commands on self-hosted Pi runner
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    env:
      VENV_PATH: ${{ github.workspace }}/.venv
    permissions:
      contents: read

    steps:
      - name: Check out repository for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check out repository for branch push
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4

      - name: Show runner context
        run: |
          echo "runner.name=${RUNNER_NAME}"
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"
          echo "github.workspace=${GITHUB_WORKSPACE}"
          pwd

      - name: Set up Python virtual environment
        shell: bash
        run: |
          python3 --version
          python3 -m venv "${VENV_PATH}"
          source "${VENV_PATH}/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python --version
          python -m pip --version

      - name: Run requested commands
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        run: |
          source "${VENV_PATH}/bin/activate"
          ${{ inputs.commands }}

      - name: Run default commands on branch push
        if: ${{ github.event_name == 'push' }}
        working-directory: .
        shell: bash
        run: |
          source "${VENV_PATH}/bin/activate"
          pwd
          echo "$GITHUB_WORKSPACE"
          uname -a
          python --version
