name: Pi Functional

on:
  push:
    branches:
      - ci/pi-runner-workflow
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to check out on the Pi runner
        required: false
        default: main
      prompt:
        description: Simple prompt to send to the chatbot
        required: false
        default: Tell me who you are in one short sentence.

jobs:
  functional-chat:
    name: Functional chat check on Pi runner
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Restore Codex auth state into workspace
        shell: bash
        run: |
          APP_HOME=~/.config/kerkov-bot
          PERSISTENT_AUTH_PATH="${APP_HOME}/codex-auth.json"
          PERSISTENT_ENV_PATH="${APP_HOME}/.env"
          test -f "${PERSISTENT_ENV_PATH}"
          test -f "${PERSISTENT_AUTH_PATH}"
          cp "${PERSISTENT_ENV_PATH}" .env
          mkdir -p data/providers/codex
          cp "${PERSISTENT_AUTH_PATH}" data/providers/codex/auth.json

      - name: Verify persistent Pi environment
        shell: bash
        run: |
          VENV_PATH=~/.venvs/kerkov-bot
          test -x "${VENV_PATH}/bin/python"
          test -f data/providers/codex/auth.json
          echo "Using venv at ${VENV_PATH}"
          echo "Found Codex auth state in runner workspace"

      - name: Run simple chatbot interaction
        shell: bash
        run: |
          set -o pipefail
          VENV_PATH=~/.venvs/kerkov-bot
          source "${VENV_PATH}/bin/activate"
          printf '/provider codex\n%s\n/q\n' "${{ inputs.prompt }}" \
            | timeout 180 python -m src.cli.main 2>&1 | tee /tmp/pi-functional-chat.log

      - name: Verify chatbot response
        shell: bash
        run: |
          test -s /tmp/pi-functional-chat.log
          grep -q "Connected to" /tmp/pi-functional-chat.log
          grep -q "Tokens:" /tmp/pi-functional-chat.log
          if grep -q "\\[bold red\\]Error:" /tmp/pi-functional-chat.log; then
            echo "Functional chat workflow saw an application error"
            exit 1
          fi
