name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "scripts/docs_lint.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "scripts/docs_lint.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The git-revision-date plugin reads commit history for each page.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra docs

      # --strict is on as of stage 5 of issue #200: the per-tool reference pages
      # landed, so the last pending check (tool-pages) resolves and a page missing
      # for a registered tool, an undocumented command, or an undocumented setting
      # now fails the build rather than reporting "pending".
      - name: Check docs against the source
        run: uv run python scripts/docs_lint.py --strict

      # --strict, with the validation levels raised in mkdocs.yml, fails the
      # build on a broken link, a bad anchor, or a page that is neither in the
      # nav nor in exclude_docs.
      - name: Build site
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Pages cannot publish from a private repo on the Free plan, so the deploy
    # hop stays off until the repo goes public and DOCS_DEPLOY is set. Gating on
    # the branch instead would turn the job red on the next merge to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
