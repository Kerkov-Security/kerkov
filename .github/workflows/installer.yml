name: Installer and wheel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
      - run: uv sync --locked --extra test
      - run: bash -n install.sh
      - run: uv run --no-sync python -m pytest tests/install tests/core/project_paths_test.py tests/core/install_support_test.py tests/cli/version_test.py --no-cov
      - name: Build sdist and wheel from sdist
        run: uv build
      - name: Install and verify outside the checkout
        run: uv run --no-sync python .github/scripts/package-smoke.py dist/*.whl
