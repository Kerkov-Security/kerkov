name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
      - run: uv sync --locked --extra dev --extra test --extra web
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag), tag
          assert tag == f"v{version}", (tag, version)
          PY
      - run: uv run --no-sync python -m flake8 --select=E301,E302,E303,E305,E306 src tests
      - run: uv run --no-sync python -m pytest tests
      - run: bash -n install.sh
      - run: uv build
      - run: uv run --no-sync python .github/scripts/package-smoke.py dist/*.whl
      - name: Prepare release artifacts
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum *.whl *.tar.gz install.sh > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Kerkov $RELEASE_TAG"
