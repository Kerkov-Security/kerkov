name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test --extra web

      - name: Check PEP 8 blank line conventions
        run: uv run python -m flake8 --select=E301,E302,E303,E305,E306 src tests

      - name: Run unit tests
        run: uv run python -m pytest tests
