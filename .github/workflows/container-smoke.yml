name: Container Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  app-smoke:
    name: App smoke test in kali-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/kerkov-security/base-images/kali-ci:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Install repository dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Show Python and pytest versions
        run: |
          uv run python --version
          uv run python -m pytest --version

      - name: Run CLI bootstrap smoke test
        run: uv run kerkov --help
