name: Vulhub E2E

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Allowlisted Vulhub E2E case id
        required: false
        default: phpunit-cve-2017-9841
      keep_lab:
        description: Leave the lab running after verification
        required: false
        default: "false"

jobs:
  vulhub-e2e:
    name: Vulhub end-to-end check on macOS runner
    runs-on:
      - self-hosted
      - macOS
    permissions:
      contents: read

    env:
      DEFAULT_CASE_ID: phpunit-cve-2017-9841

    steps:
      - name: Resolve case id and keep-lab flag
        shell: bash
        run: |
          echo "CASE_ID=${{ inputs.case_id || env.DEFAULT_CASE_ID }}" >> "$GITHUB_ENV"
          echo "KEEP_LAB=${{ inputs.keep_lab || 'false' }}" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Verify runner prerequisites
        shell: bash
        run: |
          VENV_PATH=~/.venvs/kerkov-bot
          test -x "${VENV_PATH}/bin/python"
          source "${VENV_PATH}/bin/activate"
          python --version
          docker version
          docker compose version

      - name: Run allowlisted Vulhub E2E case
        shell: bash
        run: |
          VENV_PATH=~/.venvs/kerkov-bot
          source "${VENV_PATH}/bin/activate"
          KEEP_ARGS=""
          if [ "${KEEP_LAB}" = "true" ]; then
            KEEP_ARGS="--keep-lab"
          fi

          python scripts/ci/run_vulhub_e2e.py \
            --case "${CASE_ID}" \
            --provider codex \
            ${KEEP_ARGS}

      - name: Upload Vulhub E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulhub-e2e-${{ env.CASE_ID }}
          path: artifacts/vulhub-e2e/
          if-no-files-found: warn
