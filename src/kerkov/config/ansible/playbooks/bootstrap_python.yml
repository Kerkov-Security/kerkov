- name: Ensure Python is available for Ansible
  hosts: all
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    kerkov_python_command: "{{ 'python3' if (ansible_python_interpreter | default('auto')) in ['auto', 'auto_silent', 'auto_legacy', 'auto_legacy_silent'] else ansible_python_interpreter }}"
    kerkov_python_min_minor: "{{ 9 if ansible_version.full is version('2.20', '>=') else 8 }}"
    kerkov_python_check: "{{ kerkov_python_command | quote }} -c 'import sys; sys.exit(sys.version_info < (3, {{ kerkov_python_min_minor }}))'"
  tasks:
    - name: Check the target Python interpreter without requiring Python
      ansible.builtin.raw: |
        if command -v {{ kerkov_python_command | quote }} >/dev/null 2>&1; then
          if {{ kerkov_python_check }}; then
            printf 'KERKOV_PYTHON_PRESENT\n'
            exit 0
          fi
          printf 'Existing Python interpreter is incompatible with this Ansible controller; no installation attempted.\n' >&2
          exit 42
        fi
        case {{ kerkov_python_command | quote }} in
          python3|/usr/bin/python3) ;;
          *) printf 'Configured Python interpreter is missing; fix its explicit inventory path before bootstrapping.\n' >&2; exit 42 ;;
        esac
        printf 'KERKOV_PYTHON_MISSING\n'
        exit 3
      register: kerkov_python_probe
      changed_when: false
      failed_when: kerkov_python_probe.rc not in [0, 3]
      check_mode: false

    - name: Report missing Python in preview without installing it
      ansible.builtin.raw: |
        printf 'Python 3 is missing. Preview does not install packages; apply with bootstrap_python enabled first.\n' >&2
        exit 1
      when: kerkov_python_probe.rc == 3 and ansible_check_mode
      changed_when: false
      check_mode: false

    - name: Install missing Python 3 from the target repositories
      become: true
      ansible.builtin.raw: |
        set -eu
        if command -v {{ kerkov_python_command | quote }} >/dev/null 2>&1; then
          {{ kerkov_python_check }}
          printf 'KERKOV_PYTHON_PRESENT\n'
          exit 0
        fi
        if [ ! -r /etc/os-release ]; then
          printf 'Python bootstrap requires a Debian, Ubuntu or Alpine target.\n' >&2
          exit 1
        fi
        . /etc/os-release
        case "${ID:-}" in
          debian|ubuntu)
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
            ;;
          alpine)
            apk add --no-cache python3
            ;;
          *) printf 'Automatic Python bootstrap supports Debian, Ubuntu and Alpine only.\n' >&2; exit 1 ;;
        esac
        {{ kerkov_python_check }}
        printf 'KERKOV_PYTHON_INSTALLED\n'
      when: kerkov_python_probe.rc == 3 and not ansible_check_mode
      register: kerkov_python_install
      changed_when: "'KERKOV_PYTHON_INSTALLED' in kerkov_python_install.stdout"
      check_mode: false
