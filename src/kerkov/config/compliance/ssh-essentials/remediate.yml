- name: Apply SSH essentials
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Require a supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution in ['Debian', 'Ubuntu']
        fail_msg: This baseline supports Debian and Ubuntu only.

    - name: Inspect SSH configuration
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
        follow: false
      register: ssh_config

    - name: Require an existing regular SSH configuration
      ansible.builtin.assert:
        that:
          - ssh_config.stat.exists
          - ssh_config.stat.isreg | default(false)
          - not (ssh_config.stat.islnk | default(false))
        fail_msg: OpenSSH must already be installed with a regular sshd_config.

    - name: Inspect available services
      ansible.builtin.service_facts:

    - name: Require a running OpenSSH service
      ansible.builtin.assert:
        that:
          - "ansible_facts.services.get('ssh.service', {}).get('state') == 'running' or ansible_facts.services.get('sshd.service', {}).get('state') == 'running'"
        fail_msg: This baseline requires a running systemd OpenSSH service.

    - name: Read effective SSH limits
      ansible.builtin.command: /usr/sbin/sshd -T
      register: ssh_effective
      changed_when: false
      check_mode: false

    - name: Set effective global SSH essentials
      vars:
        ssh_auth_limit: "{{ (ssh_effective.stdout | regex_findall('(?m)^maxauthtries ([0-9]+)$') | first) | int }}"
        ssh_login_grace: "{{ (ssh_effective.stdout | regex_findall('(?m)^logingracetime ([0-9]+)$') | first) | int }}"
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        insertbefore: BOF
        marker: '# {mark} KERKOV SSH ESSENTIALS'
        backup: true
        validate: /usr/sbin/sshd -t -f %s
        block: |
          PermitEmptyPasswords no
          IgnoreRhosts yes
          X11Forwarding no
          MaxAuthTries {{ (ssh_auth_limit | int) if 1 <= (ssh_auth_limit | int) <= 4 else 4 }}
          LoginGraceTime {{ (ssh_login_grace | int) if 1 <= (ssh_login_grace | int) <= 60 else 60 }}
      notify: Reload OpenSSH

  handlers:
    - name: Reload OpenSSH
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_facts.services.get('ssh.service', {}).get('state') == 'running' else 'sshd' }}"
        state: reloaded
